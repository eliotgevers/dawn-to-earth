<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 704" width="100%" height="100%" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">TS-01 / TS-02 · Sample tray stop comparison</title>
  <desc id="desc">Annotated reconstruction of the tabletop tray after the same archived motion. With a rigid stop, the tray mark aligned with the stand mark, but the contact edge was scuffed. With a soft stop, the edge was clean but the tray mark no longer lined up. The sketch represents alignment only, not a measured direction or distance.</desc>
  <style>
    text{font-family:system-ui,-apple-system,sans-serif;fill:#202c34} .k{font-size:13px;font-weight:650;letter-spacing:1px;fill:#4b5f69} .h{font-size:26px;font-weight:650} .s{font-size:18px;font-weight:620} .p{font-size:16px} .muted{fill:#4b5f69} .rule{stroke:#c3cdd0} .tray{fill:#e6eae8;stroke:#52676c;stroke-width:2} .line{fill:none;stroke:#708387;stroke-width:1.5} .mark{stroke:#26655f;stroke-width:4}
  </style>
  <rect width="480" height="704" fill="#fbfcfa"/>
  <text x="22" y="32" class="k">TS-01 / TS-02  /  TABLETOP SAMPLE TRAY</text>
  <text x="22" y="74" class="h">What changed at the tray stop?</text>
  <text x="22" y="104" class="p muted">Annotated reconstruction after the recorded motion.</text>
  <text x="22" y="129" class="p muted">Marks on the tray and stand indicate alignment.</text>
  <path d="M22 151H458" class="rule"/>
  <g aria-label="TS-01, rigid stop. Index marks stay aligned, but the tray edge has a scuff.">
    <text x="22" y="190" class="s">TS-01 · Rigid stop</text>
    <rect x="27" y="237" width="18" height="71" fill="#6c8085"/>
    <rect x="47" y="240" width="140" height="61" rx="4" class="tray"/>
    <text x="102" y="266" class="p muted">Tray</text>
    <path d="m50 252 9 4m-9 1 9 4m-9 1 7 3" fill="none" stroke="#945430" stroke-width="2.4"/>
    <path d="M60 251 75 220H222" class="line"/>
    <text x="230" y="225" class="p">Scuff at the contact edge</text>
    <path d="M122 282v19" class="mark"/>
    <path d="M72 315h98" class="line"/>
    <path d="m118 323 4-8 4 8" fill="#26655f"/>
    <path d="M133 297h64l16 14h9" class="line"/>
    <text x="230" y="316" class="p">Marks aligned</text>
  </g>
  <path d="M22 362H458" class="rule"/>
  <g aria-label="TS-02, soft stop. The contact edge stays clean, but the marks no longer align.">
    <text x="22" y="401" class="s">TS-02 · Soft stop</text>
    <rect x="27" y="448" width="18" height="71" rx="7" fill="#869a9e"/>
    <rect x="47" y="451" width="140" height="61" rx="4" class="tray"/>
    <text x="102" y="477" class="p muted">Tray</text>
    <path d="M51 464 74 431H222" class="line"/>
    <text x="230" y="436" class="p">Edge stayed clean</text>
    <path d="M143 493v19" class="mark"/>
    <path d="M72 526h98" class="line"/>
    <path d="m118 534 4-8 4 8" fill="#26655f"/>
    <path d="M150 511h47l16 11h9" class="line"/>
    <text x="230" y="527" class="p">Marks no longer aligned</text>
  </g>
  <path d="M22 572H458" class="rule"/>
  <text x="22" y="612" class="s">Meaning of the marks</text>
  <text x="22" y="641" class="p muted">Line on the tray. Triangle on the stand.</text>
  <text x="22" y="667" class="p muted">The drawing shows alignment only. No direction</text>
  <text x="22" y="689" class="p muted">or distance was recorded for the shift.</text>
</svg>
