apiVersion: 1
datasources:
  - name: Dawn to Earth InfluxDB
    uid: dawn-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: dawn-to-earth
      defaultBucket: synthetic
    secureJsonData:
      token: $GF_DAWN_INFLUX_TOKEN
