# Existing laptop data services. New workspaces use compose.local.yaml.
name: dawn-to-earth
services:
  influxdb:
    extends: {file: compose.local.yaml, service: influxdb}
    ports: ["127.0.0.1:${INFLUXDB_PORT:-48086}:8086"]
  grafana:
    extends: {file: compose.local.yaml, service: grafana}
    ports: !override ["127.0.0.1:${GRAFANA_PORT:-43000}:3000"]
    environment:
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-43000}
      GF_DAWN_INFLUX_TOKEN__FILE: /run/secrets/influxdb_token
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    secrets: !override [grafana_password, influxdb_token]
    volumes: !override
      - grafana-data:/var/lib/grafana
      - ./infra/influxdb.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro
      - ./infra/dashboards.yaml:/etc/grafana/provisioning/dashboards/archived-inspection.yaml:ro
      - ./infra/dashboards:/etc/grafana/dawn-dashboards:ro

secrets:
  influxdb_password:
    environment: INFLUXDB_PASSWORD
  influxdb_token:
    environment: INFLUXDB_TOKEN
  grafana_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
