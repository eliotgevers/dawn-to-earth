services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dawn
      POSTGRES_DB: dawn_acceptance
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [acceptance-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dawn", "-d", "dawn_acceptance"]
      interval: 3s
      timeout: 3s
      retries: 30

  influxdb:
    image: influxdb:2.10.1
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influxdb_password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influxdb_token
      DOCKER_INFLUXDB_INIT_ORG: dawn-to-earth
      DOCKER_INFLUXDB_INIT_BUCKET: synthetic
      INFLUXD_REPORTING_DISABLED: "true"
    secrets:
      - influxdb_password
      - influxdb_token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 25

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:${STACK_GRAFANA_PORT:-4332}:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_DAWN_INFLUX_TOKEN__FILE: /grafana-grants/influx-reader
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:4332}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets:
      - grafana_password
    volumes:
      - grafana-grants:/grafana-grants:ro
      - grafana-data:/var/lib/grafana
      - ./infra/influxdb.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro
      - ./infra/dashboards.yaml:/etc/grafana/provisioning/dashboards/archived-inspection.yaml:ro
      - ./infra/dashboards:/etc/grafana/dawn-dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 25

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_PUBLIC_URL: ""
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:4332}
      DTE_VIEWER_FILE: /grants/.env.viewer
    command: ["bun", "--bun", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    entrypoint: ["/bin/sh", "-ec", "export DATABASE_URL=postgresql://dawn:$$(cat /run/secrets/database_password)@postgres:5432/dawn_acceptance; exec \"$$@\"", "web"]
    ports: ["127.0.0.1:${WEB_PORT:-4331}:3000"]
    secrets: [database_password]
    volumes:
      - grants:/grants:ro
      - ../web/app:/workspace/apps/web/app:ro
      - ../web/ai:/workspace/apps/web/ai:ro
      - ../web/components:/workspace/apps/web/components:ro
      - ../web/db:/workspace/apps/web/db:ro
      - ../web/lib:/workspace/apps/web/lib:ro
      - ../web/public:/workspace/apps/web/public:ro
      - ../../wiki:/workspace/wiki:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/')).ok ? 0 : 1)"]
      interval: 8s
      timeout: 10s
      retries: 20

  # A one-shot job. Its bootstrap credentials are never mounted in the web container.
  archive-job:
    image: python:3.13.11-alpine
    profiles: [jobs]
    working_dir: /opt/backend
    environment:
      INFLUXDB_URL: http://influxdb:8086
      GRAFANA_URL: http://grafana:3000
      APP_URL: http://web:3000
      DTE_VIEWER_FILE: /grants/.env.viewer
      GRAFANA_INFLUX_TOKEN_FILE: /grafana-grants/influx-reader
      PYTHONDONTWRITEBYTECODE: "1"
      INFLUXDB_TOKEN_FILE: /run/secrets/influxdb_token
      GRAFANA_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
    entrypoint: ["/bin/sh", "/opt/backend/scripts/stack-job.sh"]
    secrets: [influxdb_token, grafana_password]
    volumes:
      - ./scripts:/opt/backend/scripts:ro
      - grants:/grants
      - grafana-grants:/grafana-grants

secrets:
  database_password: {environment: DATABASE_PASSWORD}
  grafana_password: {environment: GRAFANA_ADMIN_PASSWORD}
  influxdb_password: {environment: INFLUXDB_PASSWORD}
  influxdb_token: {environment: INFLUXDB_TOKEN}

volumes:
  acceptance-data:
  grafana-data:
  influxdb-data:
  influxdb-config:
  grants:
  grafana-grants:
